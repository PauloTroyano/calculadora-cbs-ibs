name: Atualizar tabelas da Receita

on:
  schedule:
    # Todo dia às 05:00 de Brasília (08:00 UTC). O GitHub pode atrasar alguns minutos em horários de pico.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-tabelas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar, exportar e validar as tabelas oficiais
        run: ferramentas/atualizar.sh "$RUNNER_TEMP/trabalho"

      - name: Publicar se houver mudança
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- dados; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git commit -m "Atualização automática das tabelas da Receita ($(TZ=America/Sao_Paulo date +%d/%m/%Y))"
          git push
          # Garante que o GitHub Pages publique o commit feito pelo workflow
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Não consegui pedir a publicação; ela sai no próximo push."
